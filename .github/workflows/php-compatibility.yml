name: PHP compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }} compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL
      - run: php tests/compatibility/lint.php
      - run: composer install --working-dir=tests/compatibility --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs --working-dir=tests/compatibility
      - run: php tests/compatibility/run.php
